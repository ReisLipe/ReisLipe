<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-label="Welcome to my GitHub profile" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rainbow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff2a2a"/>
      <stop offset="0.2" stop-color="#ffb000"/>
      <stop offset="0.4" stop-color="#fff200"/>
      <stop offset="0.6" stop-color="#2aff5a"/>
      <stop offset="0.8" stop-color="#2ad4ff"/>
      <stop offset="1" stop-color="#ff4dff"/>
    </linearGradient>
    <style>
      .star { fill: #ffffff; animation: tw 1.2s steps(2) infinite; }
      .s2 { animation-delay: .4s; } .s3 { animation-delay: .8s; }
      .blink { animation: tw 1s steps(2) infinite; }
      @keyframes tw { 50% { opacity: .15; } }
      text { font-family: Impact, "Arial Black", "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="170" fill="#000010"/>
  <rect x="3" y="3" width="794" height="164" fill="none" stroke="#00ffff" stroke-width="2"/>
  <rect x="8" y="8" width="784" height="154" fill="none" stroke="#ff00ff" stroke-width="2"/>
  <g>
    <rect class="star" x="40" y="30" width="3" height="3"/><rect class="star s2" x="120" y="130" width="3" height="3"/>
    <rect class="star s3" x="200" y="24" width="2" height="2"/><rect class="star" x="310" y="140" width="2" height="2"/>
    <rect class="star s2" x="420" y="22" width="3" height="3"/><rect class="star s3" x="520" y="142" width="3" height="3"/>
    <rect class="star" x="610" y="28" width="2" height="2"/><rect class="star s2" x="700" y="134" width="3" height="3"/>
    <rect class="star s3" x="755" y="40" width="3" height="3"/><rect class="star" x="70" y="100" width="2" height="2"/>
    <rect class="star s2" x="735" y="90" width="2" height="2"/><rect class="star s3" x="30" y="145" width="2" height="2"/>
  </g>
  <text x="400" y="72" text-anchor="middle" font-size="54" textLength="440" lengthAdjust="spacingAndGlyphs" fill="#000080" transform="translate(4 4)">WELCOME</text>
  <text x="400" y="72" text-anchor="middle" font-size="54" textLength="440" lengthAdjust="spacingAndGlyphs" fill="url(#rainbow)">WELCOME</text>
  <text x="400" y="118" text-anchor="middle" font-size="30" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#ffff00">TO MY GITHUB PROFILE</text>
  <text class="blink" x="400" y="148" text-anchor="middle" font-size="15" textLength="250" lengthAdjust="spacingAndGlyphs" fill="#00ff66" style="font-family: 'Courier New', Courier, monospace; font-weight: bold;">*** EST. RECIFE, BRAZIL ***</text>
</svg>
