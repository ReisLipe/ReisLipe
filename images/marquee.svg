<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .m { font-family: "Courier New", Courier, monospace; font-weight: bold; font-size: 20px; fill: #ffff00; animation: scroll 14s linear infinite; }
